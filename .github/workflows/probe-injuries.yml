name: probe-injuries
on:
  push:
    branches: [probe-injuries]
    paths: [probe/probe.py, .github/workflows/probe-injuries.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe.py
      - run: |
          git config user.name "gameday-bot"; git config user.email "gameday-bot@users.noreply.github.com"
          git add probe/out3 && git commit -m "probe results" && git push
